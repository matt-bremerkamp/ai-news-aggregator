name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile sources
        run: python -m compileall aggregator aggregator.py

      - name: Aggregator dry run
        env:
          # Intentionally no secrets here; dry-run must work without them.
          GEMINI_API_KEY: ""
        run: python aggregator.py --dry-run
